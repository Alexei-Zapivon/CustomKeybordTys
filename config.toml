# ============================================================================
#  minikeys — бинды для мини-клавиатуры
#  Файл перечитывается автоматически (раз в 2 секунды) — перезапуск не нужен.
#  Проверить файл без запуска: python -m minikeys check
# ============================================================================

[device]
# Как найти мини-клавиатуру. Узнать ID: python -m minikeys identify
# (нажмите кнопку на мини-клавиатуре — программа покажет её Hardware ID).
# match — подстрока (или список подстрок, должны совпасть все) из Hardware ID.
# Обычно достаточно VID и PID:
match = "VID_1189&PID_8890"

# Если у устройства несколько интерфейсов и нужен только один — уточните:
# match = ["VID_1189&PID_8890", "MI_00"]
# Для Bluetooth ID выглядит иначе, например: match = "VID&0002046D_PID&B35B"
# Исключить интерфейсы по подстроке:
# exclude = ["MI_02"]
# Крайний случай (одинаковые ID у двух клавиатур): жёсткий номер из identify.
# Номер может смениться после переподключения!
# device_number = 3

[settings]
# Что делать с клавишами мини-клавиатуры, которым НЕ назначен бинд:
#   "block" — глушить (в систему ничего не уходит)
#   "pass"  — пропускать как обычное нажатие
unmapped = "block"
# Писать в консоль каждое нажатие и сработавший бинд (удобно при настройке)
log_keys = true

# ============================================================================
#  БИНДЫ.  Слева — клавиша мини-клавиатуры (как её называет identify),
#  справа — действие. Имена: a..z, 0..9, f1..f24, numpad0..numpad9,
#  numpad_add, numpad_sub, numpad_mul, numpad_div, numpad_dot, numpad_enter,
#  enter, esc, space, tab, backspace, delete, insert, home, end, page_up,
#  page_down, up, down, left, right, lctrl, lshift, lalt, ... ,
#  любые неизвестные: sc_XX / sc_e0_XX (скан-код в hex, покажет identify).
#  Символы берите в кавычки: "-" = ..., "/" = ...
# ============================================================================
[binds]

# --- Короткая форма: строка = сочетание клавиш ---
a = "ctrl+shift+m"
s = "ctrl+c"
d = "ctrl+v"
f = "win+d"                                  # свернуть все окна
g = "alt+f4"

# --- Запуск программы / файла / папки / сайта ---
q = { run = "notepad.exe" }
w = { run = 'C:\Program Files\Mozilla Firefox\firefox.exe', args = "https://github.com" }
e = { run = "https://www.youtube.com" }
r = { run = '%USERPROFILE%\Downloads' }      # папка; переменные окружения раскрываются
# Путь в одинарных кавычках '...' — тогда обратные слеши не нужно удваивать.

# --- Команда cmd.exe (без окна) ---
t = { cmd = 'powershell -NoProfile -Command "Set-Clipboard (Get-Date -Format s)"' }

# --- Напечатать текст (любой язык, не зависит от раскладки) ---
z = { text = "Добрый день!\nС уважением,\n" }   # \n = Enter
x = { text = "user@example.com" }

# --- Мультимедиа; repeat = true — срабатывать и на автоповтор при удержании ---
numpad_add = { hotkey = "volume_up", repeat = true }
numpad_sub = { hotkey = "volume_down", repeat = true }
numpad_mul = "volume_mute"
numpad_enter = "media_play_pause"

# --- Удержание: кнопка ведёт себя как другая клавиша, пока зажата ---
space = { remap = "f13" }          # F13..F24 — удобные «ничьи» клавиши для горячих клавиш в программах
c = { remap = "ctrl" }             # кнопка как Ctrl (можно зажать и кликать мышкой)

# --- Макрос: последовательность шагов ---
# Шаг-строка = сочетание; таблицы: { delay = мс }, { text = ... }, { run = ... },
# { cmd = ... }, { click = "left"|"right"|"middle" }, { down = "shift" }, { up = "shift" }
[binds.v]
macro = [
  "ctrl+a",
  "ctrl+c",
  { delay = 100 },
  { run = "notepad.exe" },
  { delay = 800 },
  "ctrl+v",
]

[binds.b]
macro = [
  { down = "shift" },
  { click = "left" },
  { up = "shift" },
]
