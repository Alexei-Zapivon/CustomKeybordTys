# ============================================================================
#  minikeys — бинды для мини-клавиатуры
#  Файл перечитывается автоматически (раз в 2 секунды) — перезапуск не нужен.
#  Проверить файл без запуска: python -m minikeys check
# ============================================================================

[device]
# Мини-клавиатура (найдена командой: python -m minikeys identify)
match = "VID_1189&PID_8840"

[settings]
# Неназначенные клавиши мини-клавиатуры: "block" — глушить, "pass" — пропускать
unmapped = "block"
# Писать в консоль каждое нажатие и сработавший бинд (удобно при настройке)
log_keys = true

# ============================================================================
#  БИНДЫ: слева — кнопка мини-клавиатуры, справа — действие.
#  Кнопки вашей мини-клавиатуры: a b c d e f g h i j k l и 1 2 3 4 5 6
#
#  Виды действий:
#    "ctrl+shift+m"                      — сочетание клавиш
#    { run = "notepad.exe" }             — запустить программу / файл / папку / сайт
#    { run = 'C:\путь\к\программе.exe' } — путь пишите в ОДИНАРНЫХ кавычках
#    { text = "Привет!" }                — напечатать текст (\n — Enter)
#    { cmd = 'команда' }                 — выполнить команду cmd.exe без окна
#    { hotkey = "volume_up", repeat = true } — срабатывать и при удержании
#    { remap = "ctrl" }                  — кнопка работает как Ctrl, пока зажата
#    { macro = ["ctrl+c", { delay = 100 }, "ctrl+v"] } — последовательность
# ============================================================================
[binds]

# --- Кнопки ---
a = "ctrl+shift+m"
b = "ctrl+c"                       # копировать
c = "ctrl+v"                       # вставить
d = "ctrl+z"                       # отменить
e = { run = "notepad.exe" }        # Блокнот
f = { run = "calc.exe" }           # Калькулятор
g = { run = "https://www.google.com" }
h = { text = "Привет!" }
i = "win+d"                        # свернуть все окна
j = "win+shift+s"                  # скриншот области
k = "ctrl+shift+esc"               # диспетчер задач
l = "alt+tab"                      # переключиться на прошлое окно

# --- Цифры 1–6 (если это крутилки — поменяйте местами, как удобно) ---
"1" = { hotkey = "volume_down", repeat = true }
"2" = { hotkey = "volume_up", repeat = true }
"3" = "volume_mute"
"4" = "media_prev"
"5" = "media_next"
"6" = "media_play_pause"
